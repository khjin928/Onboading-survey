<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경력사원 온보딩 진단 설문</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --ink:#1a2230;--ink-soft:#4a556a;--line:#e3e7ee;--line-soft:#eef1f6;--bg:#f6f7fa;--card:#fff;
    --accent:#1f6feb;--accent-soft:#eaf1fe;--warn:#b4530a;--ok:#0f7a4d;--ok-soft:#e7f4ee;
    --shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);--r:14px;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:'Pretendard',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1f6feb,#0b3d91);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .brand b{font-size:15px;font-weight:700}.brand span{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px}.lead{color:var(--ink-soft);font-size:14px;margin:0 0 22px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.12s;background:#fff;text-align:left}
  .tile:hover{border-color:#b9c6e6}
  .tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(31,111,235,.08)}
  .tile .t{font-weight:700;font-size:15px}.tile .d{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  label.fld{display:block;margin-top:16px}
  label.fld .lb{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
  label.fld .lb .req{color:var(--warn)}
  input[type=text],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;transition:.12s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,235,.10)}
  textarea{resize:vertical;min-height:84px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:13px 22px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
  .btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:#155fd4}
  .btn.primary:disabled{background:#b9c6e6;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:#b9c6e6}
  .actions{display:flex;gap:10px;justify-content:space-between;margin-top:24px;align-items:center;flex-wrap:wrap}
  .prog{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .step-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between}
  .theme{margin-top:26px}.theme:first-child{margin-top:8px}
  .theme-h{font-size:12.5px;font-weight:800;color:var(--ink);background:var(--line-soft);border-radius:8px;padding:8px 12px;display:inline-block;margin-bottom:6px}
  .q{padding:18px 2px;border-bottom:1px solid var(--line-soft)}
  .q .qt{font-size:14.5px;font-weight:600;margin-bottom:14px}.q .qt .num{color:var(--accent);font-weight:800;margin-right:8px}
  .likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lk{border:1.5px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:.12s;background:#fff}
  .lk:hover{border-color:#b9c6e6}.lk.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(31,111,235,.08)}
  .lk .sc{font-size:17px;font-weight:800;color:var(--ink)}.lk .ll{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.25}
  .lk.on .sc{color:var(--accent)}
  .dual{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
  .dual .cat{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
  .dual .item-t{font-weight:700;font-size:14px;margin:2px 0 3px}.dual .item-d{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .dual .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dual .cols .cl{font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-soft)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .pill{display:inline-block;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 11px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
  .done{text-align:center;padding:40px 20px}
  .done .ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px}
  .done h2{margin:0 0 6px;font-size:20px}.done p{color:var(--ink-soft);font-size:14px;margin:0 auto;max-width:460px}
  .return-box{background:var(--ok-soft);border:1px solid #bfe3d0;border-radius:12px;padding:18px;margin:22px auto 0;max-width:520px;text-align:left}
  .return-box h3{margin:0 0 6px;font-size:14px;color:var(--ok)}
  .return-box p{font-size:13px;color:var(--ink-soft);margin:0 0 12px}
  .code-area{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;height:70px;resize:none;color:var(--ink-soft)}
  .mini-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn.sm{padding:9px 14px;font-size:13px}
  .err-banner{background:#fdecec;color:#a11;border:1px solid #f6c9c9;border-radius:10px;padding:11px 14px;font-size:13px;margin-top:16px;display:none}
  .err-banner.show{display:block}
  .muted{color:var(--ink-soft);font-size:13px}
  @media(max-width:640px){.wrap{padding:18px 14px 70px}.grid2,.row2,.row3,.dual .cols{grid-template-columns:1fr}.likert{grid-template-columns:repeat(5,1fr);gap:5px}.lk{padding:9px 2px}.lk .ll{display:none}.card{padding:20px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand"><div class="mk">HR</div>
    <div><b>경력사원 온보딩 진단</b><span>인재개발팀 · Talent Development</span></div></div></div>
  <div id="app"></div>
</div>
<script>
const HRDEST='인재개발팀';   /* 회신 안내 문구용 */
/* ===== [HR 설정] 자동 취합 =====
   Google Apps Script 웹앱 주소를 아래 따옴표 안에 넣으면, 제출 시 응답이
   구글 시트로 자동 전송됩니다(대상자 회신 불필요). 비워두면 파일/코드 저장 방식으로 동작합니다.
   배포 방법은 함께 전달된 apps_script_code.gs 안내를 참고하세요. */
const SUBMIT_URL='';
const LIKERT=[{v:5,l:'매우\n그렇다'},{v:4,l:'그렇다'},{v:3,l:'보통'},{v:2,l:'그렇지\n않다'},{v:1,l:'전혀\n그렇지 않다'}];
const SURVEYS={
  '1_new':{round:'1차',roundTag:'D+30',role:'입사자',title:'(1차, D+30) 채용 Quality 진단 · 입사자',
    desc:'입사 후 약 한 달 시점의 채용 품질을 점검합니다.',themes:[
    {cat:'(A) 채용 결정 및 기대 일치',q:[
      {t:'L',text:'채용 과정(공고, 면접, 오퍼)에서 안내받은 내용이 명확하고 신뢰할 수 있었다.'},
      {t:'L',text:'최종 처우 및 근무조건 협의 과정이 투명하고 합리적이었다.'},
      {t:'T',text:'입사 결정에 가장 크게 작용한 요인은 무엇이었나요? (처우/직무/조직문화/성장기회 등)'}]},
    {cat:'(B) 직무 및 역할 Fit',q:[
      {t:'L',text:'채용 시 안내받은 직무/역할 내용이 실제 배치된 업무와 대체로 일치한다.'},
      {t:'L',text:'현재 담당 업무가 본인의 경력과 전문성을 발휘하기에 적합하다.'},
      {t:'T',text:'채용 시 기대와 실제 업무 간 차이가 있었다면 어떤 부분인가요?'}]},
    {cat:'(C) 초기 적응 및 프로세스 개선',q:[
      {t:'L',text:'입사 첫 달, 팀과 업무에 적응하는 데 큰 어려움은 없었다.'},
      {t:'L',text:'전반적으로 이번 채용 프로세스에 만족한다.'},
      {t:'T',text:'채용 프로세스에서 개선되었으면 하는 점이 있다면 자유롭게 적어주세요.'}]}]},
  '1_hm':{round:'1차',roundTag:'D+30',role:'팀장(HM)',title:'(1차, D+30) 채용 Quality 진단 · Hiring Manager',
    desc:'담당하신 입사자에 대한 채용 품질을 평가합니다.',themes:[
    {cat:'(A) 서류·면접 대비 실제 부합도',q:[
      {t:'L',text:'서류/면접에서 파악된 역량과 실제 초기 업무 수행 역량이 대체로 부합한다.'},
      {t:'L',text:'채용 시 기대했던 직무 적합성 수준에 부합하고 있다.'},
      {t:'T',text:'서류/면접 시점과 실제 역량 간 차이가 있었다면 어떤 부분인가요?'}]},
    {cat:'(B) 초기 성과 및 적응 속도',q:[
      {t:'L',text:'현재까지의 초기 적응 속도가 기대 수준이다.'},
      {t:'L',text:'초기 업무 수행 결과물의 수준이 기대에 부합한다.'},
      {t:'T',text:'조기 안정적 전력화를 위해 추가로 필요한 지원이 있다면 적어주세요.'}]},
    {cat:'(C) 채용 종합 판단',q:[
      {t:'L',text:'이 채용 건은 전반적으로 성공적인 채용이었다고 평가한다.'},
      {t:'L',text:'향후 이 직무/포지션에 유사한 프로필의 인재를 다시 채용하고 싶다.'},
      {t:'T',text:'채용담당자에게 전달하고 싶은 피드백(포지셔닝, 소싱채널, 인터뷰 프로세스 등)을 자유롭게 적어주세요.'}]}]},
  '2_new':{round:'2차',roundTag:'D+90',role:'입사자',title:'(2차, D+90) 온보딩 적응 만족도 · 입사자',
    desc:'입사 후 약 3개월 시점의 조직 적응과 정착 정도를 종합 점검합니다.',themes:[
    {cat:'(A) 조직 적응 및 관계 형성',q:[
      {t:'L',text:'입사 후 팀 내 분위기에 자연스럽게 녹아들 수 있었다.'},
      {t:'L',text:'팀장/동료가 업무 외적인 부분(생활/고충 등)에도 관심을 보여주었다.'},
      {t:'T',text:'조직 문화나 내부 규범을 이해하는 데 어려움이 있었다면 어떤 부분이었나요?'}]},
    {cat:'(B) 업무 온보딩 및 지원 체계',q:[
      {t:'L',text:'입사 초기 업무 파악에 필요한 안내(자료, 시스템, 절차 등)가 충분히 제공되었다.'},
      {t:'L',text:'담당 업무 수행에 실질적인 도움을 받을 수 있었다 (버디, HR 등).'},
      {t:'T',text:'업무 온보딩 과정에서 가장 부족하거나 아쉬웠던 점은 무엇인가요?'}]},
    {cat:'(C) 회사 인식 및 지속 근무 의향',q:[
      {t:'L',text:'입사 전 기대했던 것과 실제 회사 환경이 대체로 일치했다.'},
      {t:'L',text:'현재 이 회사에서 장기적으로 근무하고 싶다는 생각이 있다.'},
      {t:'T',text:'회사 또는 HR에 바라는 점이 있다면 자유롭게 적어주세요.'}]}]},
  '2_hm':{round:'2차',roundTag:'D+90',role:'팀장(HM)',dual:true,title:'(2차, D+90) 온보딩 적응 자가점검 및 HM 평가',
    desc:'입사자 자가점검과 팀장 피드백을 함께 작성합니다. 작성 후 면담을 통해 공유하고 상호 서명합니다.',items:[
    {cat:'직무 역량',t:'성과 달성도',d:'부여된 업무 및 과제를 기한 내 기대 수준에 부합하는 결과물을 생산하는가?'},
    {cat:'직무 역량',t:'직무 전문성',d:'보유한 경력과 지식을 적용하여 실무에 직접적으로 기여하고 있는가?'},
    {cat:'직무 역량',t:'직무 적합성',d:'담당 직무 수행에 필요한 핵심 역량과 전문성을 보유하고 있는가?'},
    {cat:'직무 역량',t:'확장 가능성',d:'현재 직무 범위를 넘어 향후 상위 역할로의 성장 잠재력을 보이는가?'},
    {cat:'조직 적응',t:'조직 적합성',d:'회사의 핵심 가치와 일하는 방식을 존중하며, 조직의 분위기와 문화에 적응하려 노력하는가?'},
    {cat:'조직 적응',t:'협업 능력',d:'동료 및 유관 부서와 원활하게 소통하며, 공동의 목표 달성을 위해 적극적으로 협력하는가?'},
    {cat:'조직 적응',t:'책임감/성실성',d:'본인에게 부여된 역할에 대해 주인 의식을 갖고, 문제 시 대안을 찾아 끝까지 완수하려 노력하는가?'}]}
};
const CL_OPTIONS=['CL1','CL2','CL3','CL4','CL4(p)'];
let state={round:null,role:null,key:null,profile:{},answers:{},step:'entry',lastRec:null};
const app=document.getElementById('app');
const esc=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function render(){if(state.step==='entry')return renderEntry();if(state.step==='survey')return renderSurvey();if(state.step==='done')return renderDone();}
function renderEntry(){
  const rs=state.round,rl=state.role;
  app.innerHTML=`<div class="card">
    <h1>온보딩 진단 설문</h1>
    <p class="lead">해당하는 차수와 역할을 선택하고 인적사항을 입력한 뒤 시작해 주세요. 제출하면 응답 파일이 만들어지며, 이를 `+esc(HRDEST)+`에 회신하시면 됩니다.</p>
    <div class="eyebrow">1 · 진단 차수</div>
    <div class="grid2">
      <button class="tile ${rs==='1'?'on':''}" onclick="pickRound('1')"><div class="t">1차 · 채용 Quality <span class="pill">D+30</span></div><div class="d">제대로 채용했는가 조기 점검</div></button>
      <button class="tile ${rs==='2'?'on':''}" onclick="pickRound('2')"><div class="t">2차 · 온보딩 적응 <span class="pill">D+90</span></div><div class="d">잘 정착하고 있는가 종합 점검</div></button>
    </div>
    <div class="eyebrow" style="margin-top:22px">2 · 작성자 역할</div>
    <div class="grid2">
      <button class="tile ${rl==='new'?'on':''}" onclick="pickRole('new')"><div class="t">입사자 본인</div><div class="d">${rs==='2'?'온보딩 적응 만족도':'채용 Quality 진단'}</div></button>
      <button class="tile ${rl==='hm'?'on':''}" onclick="pickRole('hm')"><div class="t">팀장 (Hiring Manager)</div><div class="d">${rs==='2'?'자가점검 및 HM 평가':'채용 Quality 진단'}</div></button>
    </div>
    <div id="profileBox">${(rs&&rl)?profileFields():''}</div>
    <div class="err-banner" id="entryErr"></div>
    <div class="actions"><span class="muted">${(rs&&rl)?statePill():'차수와 역할을 먼저 선택하세요'}</span>
      <button class="btn primary" ${(rs&&rl)?'':'disabled'} onclick="startSurvey()">설문 시작 &rarr;</button></div>
  </div>`;
}
function statePill(){const s=SURVEYS[state.key];return `<span class="tag">${s.round} ${s.roundTag}</span>${s.role}`;}
function profileFields(){
  const isHM=state.role==='hm',p=state.profile;
  const clSel=CL_OPTIONS.map(c=>`<option ${p.cl===c?'selected':''}>${c}</option>`).join('');
  return `<div class="eyebrow" style="margin-top:24px">3 · 인적사항</div>
    <div class="row2">
      <label class="fld"><span class="lb">${isHM?'HM 소속':'소속'} <span class="req">*</span></span><input type="text" id="f_dept" value="${esc(p.dept)}" placeholder="예) 인재개발팀"></label>
      <label class="fld"><span class="lb">${isHM?'팀장 성명':'성명'} <span class="req">*</span></span><input type="text" id="f_name" value="${esc(p.name)}" placeholder="예) 홍길동"></label>
    </div>
    <div class="row3">
      ${isHM?`<label class="fld"><span class="lb">입사자 성명 <span class="req">*</span></span><input type="text" id="f_target" value="${esc(p.target)}" placeholder="평가 대상 입사자"></label>`:''}
      <label class="fld"><span class="lb">입사일 <span class="req">*</span></span><input type="date" id="f_hire" value="${esc(p.hire)}"></label>
      <label class="fld"><span class="lb">${isHM?'입사자 직급(CL)':'직급(CL)'} <span class="req">*</span></span><select id="f_cl"><option value="">선택</option>${clSel}</select></label>
    </div>`;
}
function pickRound(r){state.round=r;syncKey();render();}
function pickRole(r){state.role=r;syncKey();render();}
function syncKey(){state.key=(state.round&&state.role)?`${state.round}_${state.role==='hm'?'hm':'new'}`:null;}
function grabProfile(){const g=id=>document.getElementById(id)?.value?.trim()||'';state.profile={dept:g('f_dept'),name:g('f_name'),target:g('f_target'),hire:g('f_hire'),cl:g('f_cl')};}
function startSurvey(){
  grabProfile();const p=state.profile,isHM=state.role==='hm';
  const need=[p.dept,p.name,p.hire,p.cl];if(isHM)need.push(p.target);
  if(need.some(x=>!x)){const e=document.getElementById('entryErr');e.textContent='필수 항목을 모두 입력해 주세요.';e.classList.add('show');return;}
  state.answers={};state.step='survey';window.scrollTo(0,0);render();
}
function renderSurvey(){const s=SURVEYS[state.key];app.innerHTML=s.dual?dualSurvey(s):standardSurvey(s);updateProgress();}
function standardSurvey(s){
  let n=0,html='';
  s.themes.forEach(th=>{html+=`<div class="theme"><div class="theme-h">${esc(th.cat)}</div>`;
    th.q.forEach(q=>{n++;const id='q'+n;
      if(q.t==='L'){html+=`<div class="q"><div class="qt"><span class="num">${n}</span>${esc(q.text)}</div>
        <div class="likert">${LIKERT.map(o=>`<div class="lk ${state.answers[id]==o.v?'on':''}" onclick="setLikert('${id}',${o.v})"><div class="sc">${o.v}</div><div class="ll">${esc(o.l).replace(/\n/g,'<br>')}</div></div>`).join('')}</div></div>`;}
      else{html+=`<div class="q"><div class="qt"><span class="num">${n}</span>${esc(q.text)}</div>
        <textarea oninput="setText('${id}',this.value)" placeholder="자유롭게 작성해 주세요">${esc(state.answers[id]||'')}</textarea></div>`;}
    });html+=`</div>`;});
  return shell(s,html);
}
function dualSurvey(s){
  let html='';
  s.items.forEach((it,i)=>{const sid='self'+i,fid='fb'+i;
    html+=`<div class="dual"><div class="cat">${esc(it.cat)}</div><div class="item-t">${i+1}. ${esc(it.t)}</div><div class="item-d">${esc(it.d)}</div>
      <div class="cols">
        <div><div class="cl">입사자 자가점검</div><textarea oninput="setText('${sid}',this.value)" placeholder="객관적 수치 또는 구체적 행동 사례 기반으로 작성">${esc(state.answers[sid]||'')}</textarea></div>
        <div><div class="cl">팀장 피드백</div><textarea oninput="setText('${fid}',this.value)" placeholder="개선 방안 및 향후 성장 제언 기재">${esc(state.answers[fid]||'')}</textarea></div>
      </div></div>`;});
  html+=`<div class="theme"><div class="theme-h">면담 확인</div>
    <p class="hint" style="margin:8px 0 4px">입사자와 팀장 간 면담을 통해 피드백 내용을 공유하였음을 확인하며 서명(성명 입력)합니다.</p>
    <div class="row3">
      <label class="fld"><span class="lb">면담일 <span class="req">*</span></span><input type="date" oninput="setText('meetDate',this.value)" value="${esc(state.answers.meetDate||'')}"></label>
      <label class="fld"><span class="lb">입사자 서명 <span class="req">*</span></span><input type="text" oninput="setText('signNew',this.value)" value="${esc(state.answers.signNew||'')}" placeholder="입사자 성명"></label>
      <label class="fld"><span class="lb">팀장 서명 <span class="req">*</span></span><input type="text" oninput="setText('signHM',this.value)" value="${esc(state.answers.signHM||'')}" placeholder="팀장 성명"></label>
    </div></div>`;
  return shell(s,html);
}
function shell(s,inner){
  const who=s.role==='팀장(HM)'?(state.profile.target||'-')+' ('+state.profile.cl+')':state.profile.name+' ('+state.profile.cl+')';
  return `<div class="card">
    <div class="step-meta"><span><span class="tag">${s.round} ${s.roundTag}</span>${esc(s.role)}</span><span id="pctTxt">0%</span></div>
    <div class="prog"><i id="progBar"></i></div>
    <h1 style="font-size:19px">${esc(s.title)}</h1>
    <p class="lead" style="margin-bottom:8px">${esc(s.desc)}</p>
    <div class="muted" style="font-size:12.5px;margin-bottom:6px">대상: ${esc(who)} · ${esc(state.profile.dept)} · 입사일 ${esc(state.profile.hire)}</div>
    ${inner}
    <div class="err-banner" id="surveyErr"></div>
    <div class="actions"><button class="btn ghost" onclick="backToEntry()">&larr; 이전</button><button class="btn primary" onclick="submitSurvey()">제출하기</button></div>
  </div>`;
}
function setLikert(id,v){state.answers[id]=v;render();}
function setText(id,v){state.answers[id]=v;updateProgress();}
function backToEntry(){state.step='entry';window.scrollTo(0,0);render();}
function requiredKeys(){
  const s=SURVEYS[state.key],keys=[];
  if(s.dual){s.items.forEach((_,i)=>{keys.push('self'+i,'fb'+i)});keys.push('meetDate','signNew','signHM');}
  else{let n=0;s.themes.forEach(th=>th.q.forEach(()=>{n++;keys.push('q'+n)}));}
  return keys;
}
function updateProgress(){
  const keys=requiredKeys(),done=keys.filter(k=>{const v=state.answers[k];return v!==undefined&&v!=='';}).length;
  const pct=Math.round(done/keys.length*100);
  const bar=document.getElementById('progBar'),txt=document.getElementById('pctTxt');
  if(bar)bar.style.width=pct+'%';if(txt)txt.textContent=pct+'%';
}
async function submitSurvey(){
  const keys=requiredKeys(),missing=keys.filter(k=>{const v=state.answers[k];return v===undefined||v==='';});
  if(missing.length){const e=document.getElementById('surveyErr');e.textContent=`미작성 항목이 ${missing.length}개 있습니다. 모든 문항을 작성해 주세요.`;e.classList.add('show');window.scrollTo(0,document.body.scrollHeight);return;}
  const btn=event&&event.target;if(btn){btn.disabled=true;btn.textContent='제출 중...';}
  const rec=buildRecord();state.lastRec=rec;
  if(SUBMIT_URL){
    try{
      await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});
      state.sent=true;
    }catch(e){ state.sent=false; downloadJSON(rec); }   /* 전송 차단 시 파일 저장으로 자동 전환 */
  }else{
    state.sent=false; downloadJSON(rec);
  }
  state.step='done';window.scrollTo(0,0);render();
}
function buildRecord(){
  const s=SURVEYS[state.key],p=state.profile;
  const rec={_type:'survey',_key:state.key,제출시각:new Date().toLocaleString('ko-KR'),
    차수:s.round,진단시점:s.roundTag,역할:s.role,소속:p.dept,작성자:p.name,대상자:p.target||'',직급CL:p.cl,입사일:p.hire};
  if(s.dual){
    s.items.forEach((it,i)=>{rec[`${i+1}.${it.t}(자가점검)`]=state.answers['self'+i]||'';rec[`${i+1}.${it.t}(팀장피드백)`]=state.answers['fb'+i]||'';});
    rec['면담일']=state.answers.meetDate||'';rec['입사자서명']=state.answers.signNew||'';rec['팀장서명']=state.answers.signHM||'';
  }else{
    let n=0;s.themes.forEach(th=>th.q.forEach(q=>{n++;const short=q.text.length>28?q.text.slice(0,28)+'…':q.text;rec[`Q${n}. ${short}`]=state.answers['q'+n]??'';}));
    let sum=0,c=0;n=0;s.themes.forEach(th=>th.q.forEach(q=>{n++;if(q.t==='L'){sum+=Number(state.answers['q'+n]);c++;}}));
    rec['리커트평균']=c?(sum/c).toFixed(2):'';
  }
  return rec;
}
function fileLabel(rec){const who=rec.대상자||rec.작성자||'응답';return `[온보딩응답] ${rec.차수}_${rec.역할}_${who}`.replace(/[\\/:*?"<>|]/g,'');}
function downloadJSON(rec){
  const blob=new Blob([JSON.stringify(rec,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileLabel(rec)+'.json';a.click();
}
function makeCode(rec){return 'HRONB1:'+btoa(unescape(encodeURIComponent(JSON.stringify(rec))));}
function renderDone(){
  const s=SURVEYS[state.key];
  if(SUBMIT_URL && state.sent){
    /* 자동 전송 성공: 회신 불필요 */
    app.innerHTML=`<div class="card done">
      <div class="ic">&#10003;</div>
      <h2>제출이 완료되었습니다</h2>
      <p>${esc(s.round)} ${esc(s.roundTag)} · ${esc(s.role)} 설문이 <b>${esc(HRDEST)}</b>으로 접수되었습니다. 별도로 회신하실 필요 없습니다. 감사합니다.</p>
      <div style="margin-top:24px"><button class="btn ghost" onclick="resetAll()">새 설문 작성</button></div>
    </div>`;
    return;
  }
  /* 폴백: 파일/코드 회신 */
  const code=makeCode(state.lastRec);
  app.innerHTML=`<div class="card done">
    <div class="ic">&#10003;</div>
    <h2>응답이 저장되었습니다</h2>
    <p>${esc(s.round)} ${esc(s.roundTag)} · ${esc(s.role)} 설문 응답 파일이 다운로드되었습니다. 이 파일을 <b>${esc(HRDEST)}</b>에 회신해 주세요.</p>
    <div class="return-box">
      <h3>회신 방법 (둘 중 편한 방법)</h3>
      <p>1) 방금 저장된 <b>${esc(fileLabel(state.lastRec))}.json</b> 파일을 메일/메신저로 회신하거나,<br>2) 아래 응답 코드를 복사해 그대로 붙여넣어 회신해 주세요.</p>
      <textarea class="code-area" id="codeBox" readonly>${esc(code)}</textarea>
      <div class="mini-actions">
        <button class="btn ghost sm" onclick="copyCode()">응답 코드 복사</button>
        <button class="btn ghost sm" onclick="downloadJSON(state.lastRec)">응답 파일 다시 저장</button>
      </div>
    </div>
    <div style="margin-top:24px"><button class="btn ghost" onclick="resetAll()">새 설문 작성</button></div>
  </div>`;
}
function copyCode(){const t=document.getElementById('codeBox');t.select();try{document.execCommand('copy');}catch(e){}navigator.clipboard&&navigator.clipboard.writeText(t.value).catch(()=>{});const b=event.target;const o=b.textContent;b.textContent='복사됨 ✓';setTimeout(()=>b.textContent=o,1500);}
function resetAll(){state={round:null,role:null,key:null,profile:{},answers:{},step:'entry',lastRec:null};window.scrollTo(0,0);render();}
function initParams(){
  try{
    const q=new URLSearchParams(location.search);
    const r=q.get('round'); if(r==='1'||r==='2')state.round=r;
    const ro=q.get('role'); if(ro==='new'||ro==='hm')state.role=ro;
    syncKey();
    ['dept','name','target','cl','hire'].forEach(k=>{const v=q.get(k); if(v)state.profile[k]=v;});
  }catch(e){}
}
initParams();
render();
</script>
</body>
</html>
